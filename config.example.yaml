# Configuration file for MyAlphabet game
# Copy this file to config.yaml and adjust the settings

# App identity and icon
# Used by the game window/menu and by create_shortcut.py
app:
  name: "My Alphabet Game"
  icon:
    # Optional: icon shown in the window, menu, and shortcut
    # Can be absolute or relative to this config file
    path: ""
    size: 80

# External media and asset locations
resources:
  images:
    # Required: folder containing your letter images
    # Can be absolute or relative to this config file
    # Images are matched by their first letter, e.g., Lion.png -> L, Apple.jpg -> A
    folder: "path/to/your/images"
  sound:
    # Optional: disable all letter/reaction sounds
    enabled: true
    # Optional: folder containing letter sounds such as a.wav, b.wav, l.wav
    letters_folder: "path/to/sounds"
    feedback:
      # Optional: sound played after a correct answer
      correct: ""
      # Optional: sound played after a wrong answer
      wrong: ""
  rewards:
    video:
      # Set min_rounds to 0 to disable video rewards completely
      min_rounds: 3
      # 0 means only a perfect result gets a video reward
      max_wrong_answers: 1
      # Optional: folder containing reward videos (.mp4, .avi, .mkv, etc.)
      folder: ""

# Gameplay settings
game:
  # These values can be changed by the player in the start menu
  player_adjustable:
    # Number of choices shown per round (2-8)
    pictures_per_round: 4
    # Number of rounds per session (0 = unlimited, menu currently uses 1-10)
    max_rounds: 10
  # How content is shown to the player
  presentation:
    letter_font_size: 72
    show_lowercase: false
    show_image_names: false
    show_letter_hint: true
  # Timing/feel settings
  timing:
    # Show the letter first, then wait before images appear (0 = no delay)
    letter_display_delay_ms: 1500
    # Wait before moving to the next round
    next_round_delay_ms: 1500

# Visual styling
ui:
  colors:
    # Background color for menus and game screens
    background: "#f0f8ff"
    buttons:
      # Hover colors are derived automatically from these base colors
      play_again: "#2196F3"
      quit: "#FF9800"
      menu: "#4CAF50"
      letters: "#9C27B0"
      quiz: "#00BCD4"
